[package]
name = "bloomery"
version = "0.1.0"
description = "Bloomery - local-first AI agent workbench for the desktop"
authors = ["Bloomery contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures-util = "0.3"
http = "1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
html5ever = "0.38"
hnsw_rs = "0.3.4"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-013 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream"] }
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
quick-xml = "0.39"
sha2 = "0.10"
ed25519-dalek = "2"
rmcp = { version = "3.1.1", features = [
    "client",
    "transport-async-rw",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
zip = { version = "4.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bench]]
name = "retrieval"
harness = false

# 压缩 debug 构建的调试信息，显著减小 target/ 体积（仅保留行号表，
# 保留 panic backtrace 的文件/行号定位能力，基本不影响日常调试）。
[profile.dev]
debug = "line-tables-only"
