name: Bloomery release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: frontend

      - name: Build and verify unsigned candidate
        shell: pwsh
        run: .\scripts\release-check.ps1 -WithE2E -Package

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bloomery-release-candidate-${{ github.sha }}
          path: artifacts/Bloomery-*/
          if-no-files-found: error
          retention-days: 14
