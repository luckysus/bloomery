name: Bloomery release candidate

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Build a signed updater candidate using protected secrets"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install locked compute worker environment
        run: uv sync --frozen --extra packaging --extra test
        working-directory: compute-worker

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: frontend

      - name: Build and verify unsigned candidate
        shell: pwsh
        run: .\scripts\release-check.ps1 -WithE2E -Package -Performance

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bloomery-release-candidate-${{ github.sha }}
          path: artifacts/Bloomery-*/
          if-no-files-found: error
          retention-days: 14

  signed-windows-release:
    if: >-
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.signed == true)
      )
    runs-on: windows-latest
    timeout-minutes: 60
    environment: bloomery-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install locked compute worker packaging environment
        run: uv sync --frozen --extra packaging --extra test
        working-directory: compute-worker

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: frontend

      - name: Verify signed release candidate
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BLOOMERY_OFFICIAL_PRIVATE_KEY_2026: ${{ secrets.BLOOMERY_OFFICIAL_PRIVATE_KEY_2026 }}
          BLOOMERY_AUTHENTICODE_PFX_BASE64: ${{ secrets.BLOOMERY_AUTHENTICODE_PFX_BASE64 }}
          BLOOMERY_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.BLOOMERY_AUTHENTICODE_PFX_PASSWORD }}
          BLOOMERY_AUTHENTICODE_TIMESTAMP_URL: ${{ vars.BLOOMERY_AUTHENTICODE_TIMESTAMP_URL }}
          BLOOMERY_OFFICIAL_PUBLIC_KEY_2026: ${{ vars.BLOOMERY_OFFICIAL_PUBLIC_KEY_2026 }}
          BLOOMERY_UPDATER_PUBLIC_KEY: ${{ vars.BLOOMERY_UPDATER_PUBLIC_KEY }}
          BLOOMERY_UPDATER_ENDPOINT: https://github.com/luckysus/bloomery/releases/latest/download/latest.json
          BLOOMERY_RELEASE_ASSET_BASE_URL: https://github.com/luckysus/bloomery/releases/download/${{ github.ref_name }}
        run: .\scripts\release-check.ps1 -WithE2E -Signed -RequireSigned -RequireTagVersion -Package -Performance -InstallerSmoke

      - name: Upload signed candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bloomery-signed-candidate-${{ github.sha }}
          path: artifacts/Bloomery-*/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: >-
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.signed == true)
      )
    needs: signed-windows-release
    runs-on: windows-latest
    timeout-minutes: 15
    environment: bloomery-release
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne "tag" -or $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Publishing requires a semantic version tag, got $tag"
          }
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Git tag verification failed for $tag"
          }

      - name: Download verified signed artifacts
        uses: actions/download-artifact@v5
        with:
          name: bloomery-signed-candidate-${{ github.sha }}
          path: artifacts

      - name: Validate release artifact set
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -File -Recurse)
          $tag = $env:GITHUB_REF_NAME
          $expectedVersion = $tag.Substring(1)
          foreach ($required in @(
            "release-manifest.json",
            "SHA256SUMS.txt",
            "latest.json",
            "LICENSE",
            "NOTICE"
          )) {
            if (-not ($files.Name -contains $required)) {
              throw "Signed release artifact is missing: $required"
            }
          }
          if (-not ($files | Where-Object { $_.Name -match '-setup\.exe$' })) {
            throw "Signed release artifact set has no NSIS installer"
          }
          if (-not ($files | Where-Object { $_.Name -match '\.(msi|zip)$' })) {
            throw "Signed release artifact set has no MSI or portable archive"
          }
          $manifestFile = $files | Where-Object Name -eq "release-manifest.json" | Select-Object -First 1
          $manifest = Get-Content -LiteralPath $manifestFile.FullName -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $expectedVersion) {
            throw "Release manifest version does not match tag: expected $expectedVersion, got $($manifest.version)"
          }
          if ([string]$manifest.signing -ne "signed") {
            throw "Release manifest is not marked as signed"
          }
          foreach ($entry in @($manifest.artifacts)) {
            $target = $files | Where-Object Name -eq ([string]$entry.name) | Select-Object -First 1
            if ($null -eq $target) {
              throw "Release manifest target is missing: $($entry.name)"
            }
            $actualHash = (Get-FileHash -LiteralPath $target.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne ([string]$entry.sha256).ToLowerInvariant()) {
              throw "Release manifest checksum mismatch for $($entry.name)"
            }
          }
          $latestFile = $files | Where-Object Name -eq "latest.json" | Select-Object -First 1
          $latest = Get-Content -LiteralPath $latestFile.FullName -Raw | ConvertFrom-Json
          if ([string]$latest.version -ne $expectedVersion) {
            throw "Updater manifest version does not match tag"
          }
          $platform = $latest.platforms.'windows-x86_64-nsis'
          if ($null -eq $platform -or [string]::IsNullOrWhiteSpace([string]$platform.signature) -or
              [string]$platform.url -notmatch [regex]::Escape("/$tag/")) {
            throw "Updater manifest is missing the signed NSIS asset for $tag"
          }
          $checksumFile = $files | Where-Object Name -eq "SHA256SUMS.txt" | Select-Object -First 1
          foreach ($line in Get-Content -LiteralPath $checksumFile.FullName) {
            $checksumMatch = [regex]::Match($line, '^(?<hash>[0-9a-fA-F]{64}) \*(?<name>.+)$')
            if (-not $checksumMatch.Success) {
              throw "Invalid checksum line: $line"
            }
            $checksumName = $checksumMatch.Groups["name"].Value
            $target = $files | Where-Object Name -eq $checksumName | Select-Object -First 1
            if ($null -eq $target) {
              throw "Checksum target is missing: $checksumName"
            }
            $actualHash = (Get-FileHash -LiteralPath $target.FullName -Algorithm SHA256).Hash
            if ($actualHash -ne $checksumMatch.Groups["hash"].Value) {
              throw "Checksum mismatch for $checksumName"
            }
          }
          Write-Output "Signed release metadata and checksums verified."

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File -Recurse | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "Bloomery $env:GITHUB_REF_NAME" `
            --generate-notes
