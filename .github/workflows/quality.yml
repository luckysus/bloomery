name: Bloomery quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate release script contracts
        shell: pwsh
        run: .\scripts\tests\release-scripts.contract.ps1

      - name: Validate workflow contracts
        shell: pwsh
        run: .\scripts\tests\workflow.contract.ps1

      - name: Run deterministic contracts
        shell: pwsh
        run: .\scripts\test.ps1 -Stage contracts

      - name: Run deterministic frontend suite
        shell: pwsh
        run: .\scripts\test.ps1 -Stage frontend

      - name: Run deterministic Rust suite
        shell: pwsh
        run: .\scripts\test.ps1 -Stage rust

      - name: Check whitespace
        shell: pwsh
        run: git diff --check
