name: Bloomery quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install pinned Rust security tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-audit --locked --version 0.22.2
        working-directory: src-tauri

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run Rust dependency policy scan
        run: cargo deny check
        working-directory: src-tauri

      - name: Run Rust advisory scan
        run: cargo audit
        working-directory: src-tauri

      - name: Run frontend dependency audit
        run: npm audit
        working-directory: frontend

      - name: Install locked compute worker environment
        run: uv sync --frozen --extra test
        working-directory: compute-worker

      - name: Run compute worker suite
        run: .\.venv\Scripts\python.exe -m pytest -q
        working-directory: compute-worker

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate release script contracts
        shell: pwsh
        run: .\scripts\tests\release-scripts.contract.ps1

      - name: Validate workflow contracts
        shell: pwsh
        run: .\scripts\tests\workflow.contract.ps1

      - name: Run deterministic contracts
        shell: pwsh
        run: .\scripts\test.ps1 -Stage contracts

      - name: Run deterministic frontend suite
        shell: pwsh
        run: .\scripts\test.ps1 -Stage frontend

      - name: Run deterministic Rust suite
        shell: pwsh
        run: .\scripts\test.ps1 -Stage rust

      - name: Run application security suite
        shell: pwsh
        run: .\scripts\security-check.ps1 -Offline

      - name: Run reproducible steel case study
        shell: pwsh
        run: .\scripts\case-study.ps1

      - name: Upload steel case study report
        uses: actions/upload-artifact@v4
        with:
          name: bloomery-steel-case-study-${{ github.sha }}
          path: artifacts/case-study/steel-case-study.json
          if-no-files-found: error
          retention-days: 14

      - name: Run retrieval performance benchmark
        shell: pwsh
        run: .\scripts\benchmark-retrieval.ps1

      - name: Run dataset import performance benchmark
        shell: pwsh
        run: .\scripts\benchmark-dataset-import.ps1

      - name: Run agent performance benchmark
        shell: pwsh
        run: .\scripts\benchmark-agent-performance.ps1

      - name: Run startup and idle memory benchmark
        shell: pwsh
        run: .\scripts\benchmark-startup.ps1

      - name: Check whitespace
        shell: pwsh
        run: git diff --check
