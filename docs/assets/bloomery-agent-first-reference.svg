    <text x="36" y="478">整理本周生产数据</text>
    <text x="36" y="528">更新炼钢工艺 Wiki</text>
    <text x="36" y="578">导入轧制实验报告</text>
    <text x="36" y="628">解释炉次异常</text>
  </g>
  <g fill="#89928a" font-size="11">
    <text x="36" y="498">昨天 · 已完成</text>
    <text x="36" y="548">周一 · 已完成</text>
    <text x="36" y="598">上周 · 已完成</text>
    <text x="36" y="648">上周 · 已完成</text>
  </g>
  <line x1="24" y1="1000" x2="308" y2="1000" stroke="#e3e5e0"/>
