<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Bloomery agent-first desktop client reference</title>
  <desc id="desc">A conversation-first desktop agent client with a session sidebar, central task conversation and collapsible run inspector.</desc>
  <style>
    text { font-family: Inter, "Noto Sans SC", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  </style>

  <rect width="1920" height="1080" fill="#f7f7f4"/>

  <!-- Application title bar -->
  <rect width="1920" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="1920" y2="64" stroke="#e3e5e0"/>
  <rect x="22" y="16" width="32" height="32" rx="8" fill="#b86e45"/>
  <path d="M31 38V28l7-6 7 6v10M34 38v-6h8v6" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text x="66" y="37" font-size="15" font-weight="700" letter-spacing="2" fill="#20231f">BLOOMERY</text>
  <text x="208" y="37" font-size="13" fill="#89928a">/</text>
  <text x="226" y="37" font-size="13" font-weight="650" fill="#20231f">Steel Agent</text>
  <text x="354" y="37" font-size="13" fill="#89928a">/</text>
  <text x="372" y="37" font-size="13" fill="#667068">材料性能分析</text>
