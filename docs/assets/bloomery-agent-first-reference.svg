  <rect x="18" y="366" width="296" height="68" rx="7" fill="#fff7ef" stroke="#f0d3bf"/>
  <rect x="18" y="366" width="4" height="68" rx="2" fill="#e39a6a"/>
  <text x="36" y="392" font-size="13" font-weight="650" fill="#20231f">材料性能分析</text>
  <text x="36" y="414" font-size="11" fill="#9b5d3d">运行中 · 刚刚</text>
