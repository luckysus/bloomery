  <text x="1582" y="468" font-size="11" fill="#89928a">运行中 · 只读工具</text>
  <line x1="1562" y1="458" x2="1562" y2="502" stroke="#e3e5e0"/>
  <circle cx="1562" cy="518" r="7" fill="#dfe3de"/>
  <text x="1582" y="522" font-size="13" fill="#89928a">生成结论和建议</text>
  <text x="1582" y="542" font-size="11" fill="#a0a8a0">等待前一步完成</text>
