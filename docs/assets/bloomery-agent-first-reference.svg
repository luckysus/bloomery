  <path d="M1460 100h22M1460 108h22M1460 116h22" stroke="#667068" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Compact running strip -->
  <rect x="368" y="164" width="1108" height="42" rx="7" fill="#fff7ef" stroke="#f0d3bf"/>
  <circle cx="393" cy="185" r="7" fill="#e39a6a" opacity=".22"/>
  <circle cx="393" cy="185" r="3.5" fill="#b86e45"/>
  <text x="412" y="190" font-size="12" font-weight="650" fill="#9b5d3d">正在分析生产数据</text>
  <text x="564" y="190" font-size="12" fill="#7e6b5d">00:18 · 2 个工具 · 1 个子 Agent</text>
  <text x="1449" y="190" text-anchor="end" font-size="12" font-weight="650" fill="#b86e45">打开运行详情 →</text>

  <!-- User turn -->
  <rect x="808" y="255" width="628" height="72" rx="8" fill="#e8efe9"/>
  <text x="834" y="283" font-size="14" fill="#20231f">请分析 3 号炉最近一周的碳当量异常，</text>
  <text x="834" y="306" font-size="14" fill="#20231f">给出可能的工艺原因和需要核对的记录。</text>
  <circle cx="1407" cy="275" r="15" fill="#d9e4dc"/>
  <text x="1407" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#3e846d">我</text>

  <!-- Assistant turn -->
  <circle cx="393" cy="376" r="15" fill="#fff0e5"/>
  <path d="M386 376h14M393 369v14" stroke="#b86e45" stroke-width="1.7" stroke-linecap="round"/>
  <text x="422" y="373" font-size="12" font-weight="700" fill="#20231f">Bloomery</text>
  <text x="422" y="394" font-size="11" fill="#89928a">Agent · 正在生成</text>
  <text x="368" y="438" font-size="15" fill="#20231f">我先对比了生产数据、工艺记录和相关案例。</text>
  <text x="368" y="469" font-size="15" fill="#20231f">目前有两个信号值得优先核对：</text>
  <text x="392" y="510" font-size="14" fill="#20231f">1. 合金加入时序与目标牌号存在偏移。</text>
  <text x="392" y="541" font-size="14" fill="#20231f">2. 脱氧记录中的终点温度波动较大。</text>
  <text x="368" y="588" font-size="15" fill="#20231f">我会继续检查对应炉次和操作记录，再给出结论。</text>
  <rect x="368" y="620" width="1108" height="82" rx="8" fill="#ffffff" stroke="#e3e5e0"/>
  <rect x="368" y="620" width="4" height="82" rx="2" fill="#e39a6a"/>
  <circle cx="404" cy="651" r="12" fill="#fff7ef"/>
  <path d="M399 651h10M404 646v10" stroke="#b86e45" stroke-width="1.5" stroke-linecap="round"/>
  <text x="428" y="652" font-size="13" font-weight="650" fill="#20231f">query_production_data</text>
  <text x="428" y="677" font-size="12" fill="#667068">读取 3 号炉最近 7 天记录 · 只读工具 · 00:04</text>
  <text x="1439" y="653" text-anchor="end" font-size="11" font-weight="650" fill="#3e846d">运行中</text>
  <text x="1439" y="678" text-anchor="end" font-size="11" fill="#89928a">查看详情</text>
  <rect x="368" y="728" width="1108" height="62" rx="8" fill="#f0f4f0" stroke="#dce8df"/>
  <circle cx="404" cy="759" r="12" fill="#e1f1e9"/>
  <path d="M398 759h12M404 753v12" stroke="#3e846d" stroke-width="1.5" stroke-linecap="round"/>
  <text x="428" y="756" font-size="13" font-weight="650" fill="#20231f">子 Agent：检索相关文档</text>
  <text x="428" y="778" font-size="12" fill="#667068">已完成 · 8 个来源 · 结论已回传</text>
  <text x="1439" y="764" text-anchor="end" font-size="11" font-weight="650" fill="#3e846d">已完成</text>

  <!-- Composer -->
  <rect x="368" y="858" width="1108" height="150" rx="9" fill="#ffffff" stroke="#d8ded8"/>
  <text x="395" y="895" font-size="14" fill="#a0a8a0">继续告诉 Bloomery 下一步要做什么…</text>
