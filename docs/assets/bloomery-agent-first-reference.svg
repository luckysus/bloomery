  <rect x="24" y="119" width="284" height="42" rx="7" fill="#b86e45"/>
  <path d="M43 140h16M51 132v16" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="73" y="145" font-size="13" font-weight="650" fill="#fff">新建任务</text>
  <rect x="24" y="177" width="284" height="36" rx="7" fill="#f7f7f4" stroke="#e3e5e0"/>
