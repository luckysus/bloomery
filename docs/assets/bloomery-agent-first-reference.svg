  <text x="412" y="947" font-size="11" fill="#667068">Steel Agent</text>
  <rect x="537" y="929" width="118" height="28" rx="6" fill="#f7f7f4" stroke="#e3e5e0"/>
  <text x="555" y="947" font-size="11" fill="#667068">添加文件</text>
  <text x="1440" y="947" text-anchor="end" font-size="11" fill="#89928a">Enter 发送 · Shift + Enter 换行</text>
  <rect x="1389" y="971" width="58" height="32" rx="7" fill="#b86e45"/>
  <path d="M1408 987h20M1418 979v16" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>

