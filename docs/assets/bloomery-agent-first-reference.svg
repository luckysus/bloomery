  <text x="24" y="1052" font-size="11" fill="#89928a">本地运行 · 无需登录</text>

  <!-- Main conversation -->
  <rect x="332" y="64" width="1180" height="1016" fill="#f7f7f4"/>
  <rect x="332" y="64" width="1180" height="76" fill="#ffffff"/>
  <line x1="332" y1="140" x2="1512" y2="140" stroke="#e3e5e0"/>
  <text x="368" y="96" font-size="11" font-weight="700" letter-spacing="1.1" fill="#89928a">TASK</text>
  <text x="368" y="122" font-size="19" font-weight="700" fill="#20231f">材料性能分析</text>
  <rect x="590" y="96" width="87" height="25" rx="12" fill="#edf7f2"/>
  <circle cx="606" cy="108" r="4" fill="#3e846d"/>
