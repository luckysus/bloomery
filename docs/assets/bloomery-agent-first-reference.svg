  <path d="m47 198 4 4" stroke="#7e877f" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="199" font-size="12" fill="#7e877f">搜索任务和文件</text>
  <text x="24" y="250" font-size="11" font-weight="700" letter-spacing="1.1" fill="#89928a">项目</text>
  <rect x="18" y="264" width="296" height="46" rx="7" fill="#f0f4f0"/>
  <rect x="32" y="278" width="18" height="18" rx="4" fill="#d8e8dc"/>
  <path d="M37 287h8M41 283v8" stroke="#3e846d" stroke-width="1.3" stroke-linecap="round"/>
  <text x="62" y="291" font-size="13" font-weight="650" fill="#20231f">Steel Agent</text>
  <path d="m282 283 5 5-5 5" fill="none" stroke="#89928a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
