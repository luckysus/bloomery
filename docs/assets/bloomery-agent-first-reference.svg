  <text x="1364" y="36" font-size="12" fill="#667068">搜索会话</text>
  <rect x="1512" y="16" width="132" height="32" rx="7" fill="#fff7ef" stroke="#f0d3bf"/>
  <circle cx="1532" cy="32" r="4" fill="#3e846d"/>
  <text x="1545" y="36" font-size="12" font-weight="650" fill="#9b5d3d">运行中</text>
  <path d="M1685 25h22M1685 32h22M1685 39h22" stroke="#667068" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="1842" cy="32" r="16" fill="#eef0eb"/>
  <text x="1842" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#3e846d">M</text>

  <!-- Session sidebar -->
  <rect x="0" y="64" width="332" height="1016" fill="#ffffff"/>
