[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomery-compute-worker"
version = "0.1.0"
description = "Offline local compute worker protocol for Bloomery"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.19,<2",
    "optuna>=3.6,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
